<VirtualHost *:80>
    ServerName mymiam.176-159-167-168.sslip.io
    DocumentRoot /var/www/mymiam-acme
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/mymiam-acme/.well-known/acme-challenge/
    <Directory /var/www/mymiam-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass / http://127.0.0.1:8092/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8092/
    ErrorLog ${APACHE_LOG_DIR}/mymiam-error.log
    CustomLog ${APACHE_LOG_DIR}/mymiam-access.log combined
</VirtualHost>
