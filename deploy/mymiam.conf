<VirtualHost *:80>
    ServerName mymiam.176-159-167-168.sslip.io
    DocumentRoot /var/www/mymiam-acme
    <Directory /var/www/mymiam-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mymiam.176-159-167-168.sslip.io%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mymiam.176-159-167-168.sslip.io
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/mymiam/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mymiam/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8092/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8092/
    Header always set Strict-Transport-Security "max-age=604800"
    # Override host-wide headers only for MyMiam, including the service-worker policy.
    Header onsuccess unset Content-Security-Policy
    Header always unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header onsuccess unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header onsuccess unset Permissions-Policy
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header onsuccess unset Referrer-Policy
    Header always set Referrer-Policy "same-origin"
    ErrorLog ${APACHE_LOG_DIR}/mymiam-error.log
    CustomLog ${APACHE_LOG_DIR}/mymiam-access.log combined
</VirtualHost>
